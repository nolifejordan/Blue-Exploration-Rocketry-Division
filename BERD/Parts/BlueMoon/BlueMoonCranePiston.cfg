PART
{
	name = BlueMoonCranePiston
	module = Part
	author = NoLifeJordan
	MODEL
	{
		model = BERD/Parts/BlueMoon/BlueMoonCranePiston
	}
	scale = 1
	rescaleFactor = 1	
	NODE
	{
		name = node_stack_top
		transform = node_stack_top
		size = 1
		method = FIXED_JOINT
	}
	NODE
	{
		name = node_stack_bottom
		transform = node_stack_bottom
		size = 1
		method = FIXED_JOINT
	}
	sound_vent_large = decouple
